# Pousser un tag vX.Y construit Teleprompteur.exe sous Windows et le publie en release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name Teleprompteur --collect-data arabic_reshaper --hidden-import win32com.client teleprompteur.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Teleprompteur.exe
